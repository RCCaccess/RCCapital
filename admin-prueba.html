<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RC Capital — Prueba de acceso</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f3f6ff;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:24px}main{max-width:480px;width:100%;border:1px solid #2c3854;border-radius:20px;background:#111a2c;padding:32px}h1{font-size:28px}p{color:#b9c5db;line-height:1.6}label{display:block;margin:20px 0}input,button{font:inherit;width:100%;padding:14px;border-radius:10px}input{display:block;margin-top:8px;background:#0b1020;border:1px solid #425175;color:white}button{border:0;background:#849aff;color:#080d19;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#results{margin-top:24px}li{margin:14px 0;line-height:1.5}.ok{color:#91e3b8}.err{color:#ffb4ad}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><p>RC CAPITAL · CONFIGURACIÓN</p><h1>Prueba de administrador</h1><p>Usa el correo y la contraseña que creaste en Authentication. Esta prueba valida el acceso y no modifica clientes ni reportes.</p><form id="login"><label>Correo<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button id="run">Comprobar acceso</button></form><div id="results" role="status" aria-live="polite"></div></main>
<script>
const project={"url": "https://bhyftbbohsjivhhjstbb.supabase.co", "anonKey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJoeWZ0YmJvaHNqaXZoaGpzdGJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NDQ5ODAsImV4cCI6MjA5OTQyMDk4MH0.7OPqfX6ErKkYk9QeWW7oCYRLMIqyZwy0ogJPa67TnpU"};
const results=document.getElementById('results'),button=document.getElementById('run');
function status(text,ok){const p=document.createElement('p');p.className=ok?'ok':'err';p.textContent=text;results.append(p);}
document.getElementById('login').onsubmit=async e=>{
 e.preventDefault();results.replaceChildren();button.disabled=true;
 let client;
 try{
  if(!window.supabase)throw new Error('No se cargó el SDK. Revisa la conexión y recarga la página.');
  client=supabase.createClient(project.url,project.anonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  const {data:login,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
  document.getElementById('password').value='';
  if(error)throw new Error('Login: '+error.message);
  status('1. Inicio de sesión correcto.',true);
  const {data:user,error:ue}=await client.auth.getUser();if(ue||!user.user)throw new Error('No se pudo verificar la sesión.');
  const {data:admin,error:ae}=await client.rpc('rc_is_admin');if(ae)throw new Error('Rol administrativo: '+ae.message);if(admin!==true)throw new Error('Tu usuario inició sesión, pero no está registrado en rc_admins.');
  status('2. Rol de administrador confirmado.',true);
  // An intentionally unsupported, non-mutating action reaches the function's role gate.
  const response=await fetch(project.url+'/functions/v1/rc-admin',{method:'POST',headers:{'Content-Type':'application/json',apikey:project.anonKey,Authorization:'Bearer '+login.session.access_token},body:JSON.stringify({action:'check-access'})});
  const body=await response.json();
  if(response.status!==400||body.error!=='Acción inválida')throw new Error('Función rc-admin (HTTP '+response.status+'): '+(body.error||body.message||'Respuesta inesperada'));
  status('3. La función rc-admin confirmó tu acceso.',true);
  status('Prueba completada. Podemos continuar con la activación del portal.',true);
 }catch(error){document.getElementById('password').value='';status(error.message||'No se pudo completar la prueba.',false);}
 finally{if(client)try{await client.auth.signOut({scope:'local'});}catch(e){}button.disabled=false;}
};
</script></body></html>
